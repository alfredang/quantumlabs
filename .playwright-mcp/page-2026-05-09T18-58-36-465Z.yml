      - generic [ref=e98]:
        - heading "Quick Glossary" [level=3] [ref=e99]
        - generic [ref=e100]:
          - generic [ref=e101]: Bit — A classical unit of information. Either 0 or 1.
          - generic [ref=e102]: Qubit — A quantum bit. Can be |0⟩, |1⟩, or a superposition of both.
          - generic [ref=e103]: Superposition — A combination of multiple quantum states at the same time.
          - generic [ref=e104]: Entanglement — A link between qubits where measuring one tells you about the other.
          - generic [ref=e105]: Measurement — The act of reading a qubit, which forces it to choose 0 or 1.
          - generic [ref=e106]: Gate — An operation that changes the state of one or more qubits.
          - generic [ref=e107]: Bloch — A sphere used to picture the state of a single qubit.
          - generic [ref=e108]: Hadamard — The H gate. Turns |0⟩ into a 50/50 superposition.
          - generic [ref=e109]: Cnot — A 2-qubit gate that flips the target if the control is 1. Creates entanglement.
          - generic [ref=e110]: Noise — Unwanted disturbances that can flip or smear qubit states.
          - generic [ref=e111]: Pulse — A precisely shaped energy burst used to apply a gate.
